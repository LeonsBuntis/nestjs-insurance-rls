services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-insurance}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - insurance_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-insurance}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  insurance_pgdata:
